[project]
name = "hearth-adapter-fake"
version = "0.1.0"
description = "Fake adapter: in-memory lamp, vacuum and lock for exercising the platform without real devices"
requires-python = ">=3.12"
dependencies = ["hearth-devices-sdk"]

[project.scripts]
hearth-adapter-fake = "hearth_adapter_fake:main"

[tool.uv.sources]
hearth-devices-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
