# Emulates what the hub sees of AWS IoT Core: mTLS only, identity = certificate CN, ACL = the IoT policy.
per_listener_settings false
listener 8893 127.0.0.1
protocol mqtt
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
require_certificate true
# The certificate's CN is the identity, and the client id is forced to it:
# like iot:Connect on client/hearth-<hubId> with the policy attached to that certificate.
use_identity_as_username true
use_username_as_clientid true
allow_anonymous false
acl_file /mosquitto/secrets/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
